<body>
<div class="wrap">
  <svg width="1440" height="780" viewBox="0 0 1440 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pipeline of Hybrid Music Search and Verification">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
        <path d="M0,1 L10,5 L0,9 z" fill="#1e293b"/>
      </marker>
      <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
        <path d="M0,1 L10,5 L0,9 z" fill="#e11d48"/>
      </marker>
      <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
        <path d="M0,1 L10,5 L0,9 z" fill="#d97706"/>
      </marker>
      <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
        <path d="M0,1 L10,5 L0,9 z" fill="#059669"/>
      </marker>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
        <path d="M0,1 L10,5 L0,9 z" fill="#0284c7"/>
      </marker>

      <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="112%">
        <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
      </filter>
    </defs>

    <!-- ======================================================================= -->
    <!-- STAGE 1: QUERY & STRUCTURED INTENT PARSER (Left, Unified Clean Cards)   -->
    <!-- ======================================================================= -->
    <!-- Search Query Card -->
    <g filter="url(#card-shadow)">
      <rect x="20" y="235" width="138" height="150" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    </g>
    <text x="89" y="268" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Search Query</text>
    <line x1="34" y1="282" x2="144" y2="282" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="32" y="294" width="114" height="24" rx="5" fill="#ffe4e6"/>
    <text x="89" y="311" text-anchor="middle" font-size="12" font-weight="700" fill="#9f1239">一句歌词 (中/英)</text>
    <rect x="32" y="324" width="114" height="24" rx="5" fill="#e0f2fe"/>
    <text x="89" y="341" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">歌名 / 歌手点名</text>
    <rect x="32" y="354" width="114" height="24" rx="5" fill="#e0f2fe"/>
    <text x="89" y="371" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">场景 / 情绪描述</text>

    <!-- Arrow: Query -> Intent Parser -->
    <line x1="158" y1="310" x2="186" y2="310" stroke="#1e293b" stroke-width="2.4" marker-end="url(#arr)"/>

    <!-- Unified Intent Parser & Structured Slots Card (No awkward grey trapezoid!) -->
    <g filter="url(#card-shadow)">
      <rect x="190" y="168" width="142" height="365" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2"/>
      <rect x="190" y="168" width="142" height="36" rx="12" fill="#f1f5f9"/>
      <rect x="190" y="192" width="142" height="12" fill="#f1f5f9"/>
    </g>
    <text x="261" y="192" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Intent Parser</text>
    <text x="261" y="226" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">1. C3 词表门禁归一</text>
    <text x="261" y="248" text-anchor="middle" font-size="12" fill="#475569">2. 中→英歌词转述</text>
    <text x="261" y="270" text-anchor="middle" font-size="12" fill="#475569">3. 语义卡片改写</text>

    <line x1="204" y1="286" x2="318" y2="286" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="261" y="308" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0369a1">Structured Slots</text>

    <rect x="202" y="320" width="118" height="56" rx="7" fill="#eff6ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="261" y="343" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0369a1">Hard Filters</text>
    <text x="261" y="362" text-anchor="middle" font-size="11" fill="#334155">流派/情绪/语种/人声</text>

    <rect x="202" y="386" width="118" height="56" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="261" y="409" text-anchor="middle" font-size="12.5" font-weight="800" fill="#166534">Soft Tags</text>
    <text x="261" y="428" text-anchor="middle" font-size="11" fill="#334155">推断软偏好 (仅加分)</text>

    <rect x="202" y="452" width="118" height="62" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="261" y="475" text-anchor="middle" font-size="12.5" font-weight="800" fill="#334155">User Prefs</text>
    <text x="261" y="494" text-anchor="middle" font-size="11" fill="#475569">长期喜欢加分 /</text>
    <text x="261" y="508" text-anchor="middle" font-size="11" fill="#475569">讨厌标签硬排除</text>

    <!-- ======================================================================= -->
    <!-- STAGE 2: 4-ROUTE PARALLEL RECALL (Color-coded by Track A vs Track B!)   -->
    <!-- ======================================================================= -->
    <rect x="364" y="88" width="218" height="482" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="473" y="118" text-anchor="middle" font-size="16.5" font-weight="800" fill="#0f172a">Multi-Route Recall</text>
    <text x="473" y="138" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">每路并行召回 Top-30</text>

    <!-- Route 1: Lyric Route (ROSE — matches Track A!) -->
    <g filter="url(#card-shadow)">
      <rect x="380" y="154" width="186" height="92" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
    </g>
    <text x="473" y="179" text-anchor="middle" font-size="14.5" font-weight="800" fill="#9f1239">① Lyric Route (歌词路)</text>
    <text x="473" y="200" text-anchor="middle" font-size="12" font-weight="600" fill="#be123c">LIKE + 词覆盖 + 歌词向量</text>
    <text x="473" y="218" text-anchor="middle" font-size="11.5" fill="#881337">Cross-Encoder 行级打分</text>
    <text x="473" y="236" text-anchor="middle" font-size="11" font-weight="700" fill="#9f1239">输出: line_no + start_ms</text>

    <!-- Route 2: Title / Artist Route (BLUE — matches Track B!) -->
    <g filter="url(#card-shadow)">
      <rect x="380" y="262" width="186" height="86" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
    </g>
    <text x="473" y="288" text-anchor="middle" font-size="14.5" font-weight="800" fill="#0369a1">② Title / Artist Route</text>
    <text x="473" y="310" text-anchor="middle" font-size="12" font-weight="600" fill="#0284c7">BM25 + Fuzzy (编辑距离≤2)</text>
    <text x="473" y="330" text-anchor="middle" font-size="11.5" fill="#475569">容忍拼写错误与缩写</text>

    <!-- Route 3: Semantic Route (BLUE — matches Track B!) -->
    <g filter="url(#card-shadow)">
      <rect x="380" y="364" width="186" height="86" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
    </g>
    <text x="473" y="390" text-anchor="middle" font-size="14.5" font-weight="800" fill="#0369a1">③ Semantic Route</text>
    <text x="473" y="412" text-anchor="middle" font-size="12" font-weight="600" fill="#0284c7">BGE-M3 (1024d) 向量</text>
    <text x="473" y="432" text-anchor="middle" font-size="11.5" fill="#475569">歌曲卡片余弦检索</text>

    <!-- Route 4: Similar Route (BLUE — matches Track B!) -->
    <g filter="url(#card-shadow)">
      <rect x="380" y="466" width="186" height="86" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
    </g>
    <text x="473" y="492" text-anchor="middle" font-size="14.5" font-weight="800" fill="#0369a1">④ Similar Route</text>
    <text x="473" y="514" text-anchor="middle" font-size="12" font-weight="600" fill="#0284c7">种子曲向量近邻检索</text>
    <text x="473" y="534" text-anchor="middle" font-size="11.5" fill="#475569">强制剔除种子歌自身</text>

    <!-- Fan-out Arrows: Intent Parser -> 4 Routes -->
    <path d="M 332 230 H 350 V 200 H 376" fill="none" stroke="#e11d48" stroke-width="2.4" marker-end="url(#arr-red)"/>
    <path d="M 332 255 H 350 V 305 H 376" fill="none" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arr)"/>
    <path d="M 350 305 V 407 H 376" fill="none" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arr)"/>
    <path d="M 350 407 V 509 H 376" fill="none" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arr)"/>

    <!-- ======================================================================= -->
    <!-- STAGE 3: DUAL-TRACK RANKING (Upper Lyric Track vs Lower RRF+Rerank)     -->
    <!-- ======================================================================= -->
    <!-- UPPER TRACK: Track A Lyric Direct Rank (Rose) -->
    <rect x="616" y="120" width="424" height="135" rx="14" fill="#fff1f2" fill-opacity="0.7" stroke="#e11d48" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="636" y="148" font-size="15.5" font-weight="800" fill="#9f1239">Track A · 歌词专线直排 (跳过 RRF 与卡片重排)</text>

    <g filter="url(#card-shadow)">
      <rect x="638" y="166" width="172" height="70" rx="10" fill="#ffffff" stroke="#e11d48" stroke-width="1.8"/>
      <text x="724" y="196" text-anchor="middle" font-size="14" font-weight="800" fill="#881337">Hard Filter</text>
      <text x="724" y="218" text-anchor="middle" font-size="12" fill="#475569">satisfies(filters)</text>

      <rect x="842" y="166" width="178" height="70" rx="10" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.8"/>
      <text x="931" y="196" text-anchor="middle" font-size="14" font-weight="800" fill="#9f1239">Lyric Conf Sort</text>
      <text x="931" y="218" text-anchor="middle" font-size="12" fill="#be123c">按歌词行置信度直接排序</text>
    </g>

    <line x1="566" y1="200" x2="634" y2="200" stroke="#e11d48" stroke-width="2.6" marker-end="url(#arr-red)"/>
    <line x1="810" y1="200" x2="838" y2="200" stroke="#e11d48" stroke-width="2.4" marker-end="url(#arr-red)"/>

    <!-- LOWER TRACK: Track B General Fusion & Rerank (Blue, Unified Rounded Cards!) -->
    <rect x="616" y="285" width="424" height="285" rx="14" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <text x="636" y="316" font-size="15.5" font-weight="800" fill="#0369a1">Track B · 多路 RRF 融合与交叉编码精排 (常规线)</text>

    <!-- RRF Fusion Operator Circle -->
    <circle cx="668" cy="422" r="29" fill="#ffffff" stroke="#0284c7" stroke-width="2.4" filter="url(#card-shadow)"/>
    <text x="668" y="418" text-anchor="middle" font-family="Cambria Math, Times New Roman, serif" font-size="16" font-weight="800" fill="#0369a1">RRF</text>
    <text x="668" y="438" text-anchor="middle" font-size="12" font-weight="800" fill="#0284c7">⊕ 融合</text>

    <!-- Arrows from Routes 2, 3, 4 into RRF circle -->
    <path d="M 566 305 H 598 V 406 H 636" fill="none" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arr)"/>
    <line x1="566" y1="422" x2="636" y2="422" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arr)"/>
    <path d="M 566 509 H 598 V 438 H 636" fill="none" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arr)"/>

    <!-- Hard Filter Box -->
    <g filter="url(#card-shadow)">
      <rect x="720" y="375" width="138" height="94" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
    </g>
    <text x="789" y="405" text-anchor="middle" font-size="14.5" font-weight="800" fill="#0f172a">Hard Filter</text>
    <text x="789" y="427" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">人声 / 语种 / 时长</text>
    <text x="789" y="449" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0369a1">+ Soft Tag 加分</text>

    <line x1="697" y1="422" x2="717" y2="422" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arr)"/>

    <!-- BGE-Reranker Card (Matching Rounded Rect, NOT a mismatched trapezoid!) -->
    <g filter="url(#card-shadow)">
      <rect x="884" y="375" width="138" height="94" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    </g>
    <text x="953" y="405" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1e3a8a">BGE-Reranker</text>
    <text x="953" y="427" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">Cross-Encoder 精排</text>
    <text x="953" y="449" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">σ(x) + 点名置顶</text>

    <line x1="858" y1="422" x2="881" y2="422" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arr)"/>

    <!-- CLEAN Constraint Injection Route UNDERNEATH Multi-Route Recall (Zero text collision!) -->
    <path d="M 261 533 V 602 H 789 V 473" fill="none" stroke="#0284c7" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arr-blue)"/>
    <rect x="405" y="588" width="285" height="26" rx="13" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
    <text x="547" y="605" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">注入 Hard Filters / Soft Tags / 排除标签</text>

    <!-- ======================================================================= -->
    <!-- STAGE 4: VERIFY GATE & AUTO-RELAX LOOP (Generous horizontal spacing)    -->
    <!-- ======================================================================= -->
    <g filter="url(#card-shadow)">
      <rect x="1084" y="235" width="142" height="132" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2.2"/>
    </g>
    <text x="1155" y="266" text-anchor="middle" font-size="16" font-weight="800" fill="#92400e">Verify Gate</text>
    <line x1="1100" y1="278" x2="1210" y2="278" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="1155" y="303" text-anchor="middle" font-size="14" font-weight="800" fill="#78350f">歌词 <tspan font-family="Cambria Math, serif" font-style="italic" font-size="15.5">τ</tspan> ≥ 0.75</text>
    <text x="1155" y="327" text-anchor="middle" font-size="14" font-weight="800" fill="#78350f">常规 <tspan font-family="Cambria Math, serif" font-style="italic" font-size="15.5">τ</tspan> ≥ 0.30</text>
    <text x="1155" y="350" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">点名实体/歌手核验</text>

    <!-- Merge Track A & Track B into Verify Gate -->
    <path d="M 1020 200 H 1056 V 282 H 1080" fill="none" stroke="#e11d48" stroke-width="2.4" marker-end="url(#arr-red)"/>
    <path d="M 1022 422 H 1056 V 322 H 1080" fill="none" stroke="#1e293b" stroke-width="2.4" marker-end="url(#arr)"/>

    <!-- Auto-Relax Feedback Loop (Top Dashed Amber Line back to Recall) -->
    <path d="M 1155 235 V 42 H 473 V 84" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="7 4" marker-end="url(#arr-amber)"/>
    <rect x="605" y="24" width="425" height="34" rx="17" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
    <text x="817" y="46" text-anchor="middle" font-size="13.5" font-weight="800" fill="#92400e">↺ Score &lt; <tspan font-family="Cambria Math, serif" font-style="italic" font-size="16">τ</tspan> 或结果不足 → 按序放宽 (去软偏好→场景→次情绪→流派)</text>

    <!-- ======================================================================= -->
    <!-- STAGE 5: WHITELIST CHECK & FINAL OUTPUT                                 -->
    <!-- ======================================================================= -->
    <!-- Branch 1: Pass -> finish() -->
    <line x1="1226" y1="301" x2="1276" y2="301" stroke="#059669" stroke-width="2.6" marker-end="url(#arr-green)"/>
    <text x="1251" y="291" text-anchor="middle" font-size="12.5" font-weight="800" fill="#059669">Pass</text>

    <g filter="url(#card-shadow)">
      <rect x="1280" y="210" width="140" height="182" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2"/>
    </g>
    <text x="1350" y="242" text-anchor="middle" font-family="Consolas, monospace" font-size="16.5" font-weight="800" fill="#166534">finish()</text>
    <text x="1350" y="264" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">三重防幻觉校验</text>
    <line x1="1296" y1="276" x2="1404" y2="276" stroke="#86efac" stroke-width="1.5"/>
    <text x="1350" y="301" text-anchor="middle" font-size="13" font-weight="800" fill="#166534">1. ID ⊆ allowed</text>
    <text x="1350" y="324" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">2. 复核 Filters</text>
    <text x="1350" y="347" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">3. DB 权威水合</text>
    <text x="1350" y="374" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">→ 输出零幻觉歌单</text>

    <!-- Branch 2: Empty / Mismatch -> ask_user() / Refusal -->
    <path d="M 1155 367 V 460" fill="none" stroke="#e11d48" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#arr-red)"/>
    <text x="1146" y="420" text-anchor="end" font-size="12" font-weight="700" fill="#be123c">Empty / Mismatch</text>

    <g filter="url(#card-shadow)">
      <rect x="1084" y="464" width="336" height="106" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
    </g>
    <text x="1252" y="492" text-anchor="middle" font-size="15" font-weight="800" fill="#9f1239"><tspan font-family="Consolas, monospace">ask_user()</tspan> / Refusal</text>
    <text x="1252" y="516" text-anchor="middle" font-size="12.5" font-weight="600" fill="#be123c">• 窄约束 0 首 → 反问引导换语种/流派</text>
    <text x="1252" y="538" text-anchor="middle" font-size="12.5" font-weight="600" fill="#be123c">• 点名歌不在库 → 明确拒答不拿假歌凑数</text>
    <text x="1252" y="558" text-anchor="middle" font-size="11.5" fill="#881337">记录 pending_question 供下轮续接</text>

    <!-- ======================================================================= -->
    <!-- BOTTOM CONCRETE TRACE & LEGEND STRIP (With Clean Divider Line)          -->
    <!-- ======================================================================= -->
    <rect x="20" y="636" width="1400" height="122" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
    <text x="44" y="672" font-size="14.5" font-weight="800" fill="#0f172a">真实 Trace 示例 (歌词搜歌):</text>

    <rect x="248" y="649" width="242" height="38" rx="8" fill="#1e293b"/>
    <text x="369" y="673" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f8fafc">"歌词 I search for the strength"</text>
    <line x1="490" y1="668" x2="522" y2="668" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arr)"/>

    <rect x="526" y="649" width="232" height="38" rx="8" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
    <text x="642" y="673" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9f1239">① 歌词路: 第 7 行, 32.28s</text>
    <line x1="758" y1="668" x2="790" y2="668" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arr)"/>

    <rect x="794" y="649" width="242" height="38" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="915" y="673" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">Track A 直排: conf=1.0 ≥ 0.75</text>
    <line x1="1036" y1="668" x2="1068" y2="668" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arr)"/>

    <rect x="1072" y="649" width="326" height="38" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1235" y="673" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">《A Road in the Country》 (点击跳至 32.28s)</text>

    <!-- Horizontal Separator between Trace and Legend -->
    <line x1="44" y1="704" x2="1398" y2="704" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Legend Row -->
    <line x1="44" y1="732" x2="88" y2="732" stroke="#1e293b" stroke-width="2.4" marker-end="url(#arr)"/>
