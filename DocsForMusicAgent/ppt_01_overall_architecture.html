<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图1 · 搜歌 Agent 整体框架 (LangGraph)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #ffffff;
    color: #0f172a;
    font-family: "Inter", "Segoe UI", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1480px;
    margin: 0 auto;
    padding: 12px 16px;
    background: #ffffff;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
  }
</style>
</head>
<body>
<div class="wrap">
  <svg width="1440" height="780" viewBox="0 0 1440 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture of LangGraph Music Search Agent">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
        <path d="M0,1 L10,5 L0,9 z" fill="#1e293b"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
        <path d="M0,1 L10,5 L0,9 z" fill="#5b21b6"/>
      </marker>
      <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
        <path d="M0,1 L10,5 L0,9 z" fill="#059669"/>
      </marker>
      <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
        <path d="M0,1 L10,5 L0,9 z" fill="#dc2626"/>
      </marker>
      <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
        <path d="M0,1 L10,5 L0,9 z" fill="#d97706"/>
      </marker>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
        <path d="M0,1 L10,5 L0,9 z" fill="#0284c7"/>
      </marker>

      <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="112%">
        <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
      </filter>
    </defs>

    <!-- ======================================================================= -->
    <!-- 1. TOP DETERMINISTIC BYPASS (Fast Path & Idempotency)                   -->
    <!-- ======================================================================= -->
    <rect x="385" y="18" width="675" height="72" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="545" y="48" text-anchor="middle" font-size="15" font-weight="800" fill="#92400e">Fast Path · 确定性直通旁路</text>
    <text x="545" y="70" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b45309">首轮无历史 + 精确歌名/歌手 → 0 次 LLM 直接返回</text>

    <line x1="722" y1="30" x2="722" y2="78" stroke="#fcd34d" stroke-width="1.5"/>

    <rect x="742" y="29" width="298" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4"/>
    <text x="891" y="51" text-anchor="middle" font-size="13.5" font-weight="800" fill="#92400e">turn_id 幂等短路</text>
    <text x="891" y="69" text-anchor="middle" font-size="12" fill="#b45309">命中缓存 last_output 直接返回</text>

    <!-- ======================================================================= -->
    <!-- 2. LEFT ENTRY: USER INPUT & PREPARE_RUN (Clean Rounded Cards)           -->
    <!-- ======================================================================= -->
    <!-- User Input Card -->
    <g filter="url(#card-shadow)">
      <rect x="24" y="218" width="152" height="122" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    </g>
    <text x="100" y="250" text-anchor="middle" font-size="16.5" font-weight="800" fill="#0f172a">User Input</text>
    <line x1="40" y1="262" x2="160" y2="262" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="40" y="274" width="120" height="25" rx="6" fill="#e2e8f0"/>
    <text x="100" y="291" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">Query (多轮对话)</text>
    <rect x="40" y="305" width="120" height="24" rx="6" fill="#e2e8f0"/>
    <text x="100" y="321" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">uid + session_id</text>

    <!-- Arrow: User Input -> prepare_run -->
    <line x1="176" y1="279" x2="210" y2="279" stroke="#1e293b" stroke-width="2.4" marker-end="url(#arr)"/>

    <!-- prepare_run Card (Standard Rounded Rect, NOT a neural trapezoid) -->
    <g filter="url(#card-shadow)">
      <rect x="214" y="218" width="142" height="122" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
      <rect x="214" y="218" width="142" height="32" rx="12" fill="#e0f2fe"/>
      <rect x="214" y="238" width="142" height="12" fill="#e0f2fe"/>
    </g>
    <text x="285" y="240" text-anchor="middle" font-size="14.5" font-weight="800" fill="#0369a1">prepare_run</text>
    <text x="285" y="272" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">1. 会话互斥锁</text>
    <text x="285" y="294" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">2. 载入历史状态</text>
    <text x="285" y="316" text-anchor="middle" font-size="12" fill="#475569">3. 组装 Messages</text>

    <!-- Fast Path Branch from prepare_run up to Fast Path box -->
    <path d="M 285 218 V 54 H 381" fill="none" stroke="#d97706" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arr-amber)"/>
    <rect x="234" y="114" width="102" height="24" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="285" y="130" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">精确命中 / 幂等</text>

    <!-- ======================================================================= -->
    <!-- 3. CENTER: LANGGRAPH STATEGRAPH (Zero Line Crossings!)                  -->
    <!-- ======================================================================= -->
    <rect x="385" y="118" width="725" height="390" rx="16" fill="#f8fafc" stroke="#0284c7" stroke-width="2.2"/>
    <rect x="385" y="118" width="725" height="38" rx="16" fill="#e0f2fe"/>
    <rect x="385" y="142" width="725" height="14" fill="#e0f2fe"/>
    <text x="410" y="143" font-size="17" font-weight="800" fill="#0369a1">LangGraph · StateGraph</text>
    <text x="1088" y="143" text-anchor="end" font-size="13" font-weight="700" fill="#0284c7">Cyclic Single-Agent State Machine (Max 5 Steps)</text>

    <!-- Arrow: prepare_run -> 1. Guard -->
    <line x1="356" y1="279" x2="412" y2="279" stroke="#1e293b" stroke-width="2.4" marker-end="url(#arr)"/>

    <!-- ReAct Loop Top Return Edge: 3. Tools Node -> 1. Guard Node -->
    <path d="M 975 232 V 180 H 490 V 232" fill="none" stroke="#5b21b6" stroke-width="2.4" marker-end="url(#arr-purple)"/>
    <rect x="595" y="166" width="275" height="26" rx="13" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="732" y="183" text-anchor="middle" font-size="12.5" font-weight="800" fill="#4c1d95">↻ ReAct Loop · 追加 ToolMessage 继续</text>

    <!-- NODE 1: Guard Node -->
    <g filter="url(#card-shadow)">
      <rect x="416" y="235" width="150" height="92" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
      <rect x="416" y="235" width="150" height="28" rx="12" fill="#fef3c7"/>
      <rect x="416" y="252" width="150" height="11" fill="#fef3c7"/>
    </g>
    <text x="491" y="255" text-anchor="middle" font-size="15.5" font-weight="800" fill="#92400e">1. Guard Node</text>
    <text x="491" y="285" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1e293b">步数 ≤ 5 · 时限 ≤ 45s</text>
    <text x="491" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Tokens ≤ 20k · 断连检测</text>

    <!-- Edge: Guard -> LLM -->
    <line x1="566" y1="279" x2="634" y2="279" stroke="#1e293b" stroke-width="2.4" marker-end="url(#arr)"/>
    <text x="600" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">预算 OK</text>

    <!-- NODE 2: LLM Node -->
    <g filter="url(#card-shadow)">
      <rect x="638" y="235" width="180" height="92" rx="12" fill="#ffffff" stroke="#6d28d9" stroke-width="2.2"/>
      <rect x="638" y="235" width="180" height="28" rx="12" fill="#ede9fe"/>
      <rect x="638" y="252" width="180" height="11" fill="#ede9fe"/>
    </g>
    <text x="728" y="255" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">2. LLM Node</text>
    <text x="728" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">DeepSeek (temp = 0)</text>
    <text x="728" y="306" text-anchor="middle" font-size="12" fill="#475569">意图决策 &amp; 工具规划</text>

    <!-- Edge: LLM -> Tools -->
    <line x1="818" y1="279" x2="886" y2="279" stroke="#1e293b" stroke-width="2.4" marker-end="url(#arr)"/>
    <text x="852" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">tool_calls</text>

    <!-- NODE 3: Tools Node -->
    <g filter="url(#card-shadow)">
      <rect x="890" y="235" width="190" height="92" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.2"/>
      <rect x="890" y="235" width="190" height="28" rx="12" fill="#d1fae5"/>
      <rect x="890" y="252" width="190" height="11" fill="#d1fae5"/>
    </g>
    <text x="985" y="255" text-anchor="middle" font-size="15" font-weight="800" fill="#065f46">3. Tools Node</text>
    <text x="985" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">派发执行 7 大工具</text>
    <text x="985" y="306" text-anchor="middle" font-size="12" fill="#475569">同步更新白名单与状态</text>

    <!-- NODE 4: Finalize Node -->
    <g filter="url(#card-shadow)">
      <rect x="618" y="402" width="220" height="82" rx="12" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    </g>
    <text x="728" y="432" text-anchor="middle" font-size="15.5" font-weight="800" fill="#f8fafc">4. Finalize Node (唯一出口)</text>
    <text x="728" y="455" text-anchor="middle" font-size="12.5" fill="#cbd5e1">封装 Output + 全链路 Trace</text>
    <text x="728" y="473" text-anchor="middle" font-size="12" fill="#94a3b8">持久化写回 MySQL 会话表</text>

    <!-- Edge: Guard -> Finalize (Degrade) -->
    <path d="M 491 327 V 443 H 614" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-red)"/>
    <rect x="432" y="366" width="136" height="24" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="500" y="382" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">超限/断连 → 优雅降级</text>

    <!-- Edge: LLM -> Finalize (Direct Text / Refusal) -->
    <line x1="728" y1="327" x2="728" y2="398" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arr)"/>
    <text x="736" y="368" font-size="11.5" font-weight="600" fill="#475569">无工具调用</text>

    <!-- Edge: Tools -> Finalize (finish / ask_user) — stays on left side of Tools Node (x=935) -->
    <path d="M 935 327 V 443 H 842" fill="none" stroke="#1e293b" stroke-width="2.4" marker-end="url(#arr)"/>
    <rect x="858" y="366" width="142" height="24" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
    <text x="929" y="382" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">finish / ask_user</text>

    <!-- ======================================================================= -->
    <!-- 4. RIGHT OUTPUT PANEL (Positioned so Finalize -> Response NEVER crosses Tools) -->
    <!-- ======================================================================= -->
    <rect x="1158" y="175" width="256" height="333" rx="16" fill="#f8fafc" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="1286" y="208" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">Agent Response</text>
    <text x="1286" y="229" text-anchor="middle" font-size="12.5" font-weight="600" fill="#64748b">SSE 实时阶段流 + 结构化结果</text>

    <!-- Fast Path joins top of Agent Response -->
    <path d="M 1060 54 H 1286 V 171" fill="none" stroke="#d97706" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arr-amber)"/>

    <!-- Finalize -> Agent Response (Routed cleanly at y=488, while Tools<->Suite stays on far right/left with zero crossing!) -->
    <path d="M 838 458 H 1154" fill="none" stroke="#1e293b" stroke-width="2.6" marker-end="url(#arr)"/>
    <text x="1085" y="448" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Final Output</text>

    <g filter="url(#card-shadow)">
      <rect x="1180" y="248" width="212" height="68" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
      <text x="1286" y="275" text-anchor="middle" font-size="15" font-weight="800" fill="#166534">Songs (1–5 首歌单)</text>
      <text x="1286" y="297" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">歌曲卡片 + 推荐理由 + 歌词毫秒锚点</text>

      <rect x="1180" y="330" width="212" height="68" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
      <text x="1286" y="357" text-anchor="middle" font-size="15" font-weight="800" fill="#92400e">Clarify (反问澄清)</text>
      <text x="1286" y="379" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">槽位追问 + 可点击候选选项</text>

      <rect x="1180" y="412" width="212" height="68" rx="10" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.8"/>
      <text x="1286" y="439" text-anchor="middle" font-size="15" font-weight="800" fill="#9f1239">Refusal / Text</text>
      <text x="1286" y="461" text-anchor="middle" font-size="12" font-weight="600" fill="#be123c">未收录明确拒答 / 单曲详情回答</text>
    </g>

    <!-- ======================================================================= -->
    <!-- 5. BOTTOM-LEFT: RUNCONTEXT & SESSION MEMORY (Clean Schema Badges)       -->
    <!-- ======================================================================= -->
    <rect x="64" y="555" width="490" height="195" rx="14" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
    <text x="88" y="586" font-size="16" font-weight="800" fill="#0369a1">RunContext &amp; Session Memory (MySQL 持久化状态)</text>

    <!-- Clean Schema Field Badges (No fake tensor stripes!) -->
    <rect x="88" y="604" width="132" height="34" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="154" y="626" text-anchor="middle" font-family="Consolas, monospace" font-size="13.5" font-weight="700" fill="#4c1d95">allowed_ids</text>
    <text x="236" y="626" font-size="13.5" font-weight="600" fill="#1e293b">本轮检索返回 ID 白名单（防幻觉核心）</text>

    <rect x="88" y="650" width="132" height="34" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="154" y="672" text-anchor="middle" font-family="Consolas, monospace" font-size="13.5" font-weight="700" fill="#0369a1">constraints</text>
    <text x="236" y="672" font-size="13.5" font-weight="600" fill="#1e293b">多轮累计硬过滤条件 + 已排除标签</text>

    <rect x="88" y="696" width="132" height="34" rx="7" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/>
    <text x="154" y="718" text-anchor="middle" font-family="Consolas, monospace" font-size="13.5" font-weight="700" fill="#065f46">seen / pending</text>
    <text x="236" y="718" font-size="13.5" font-weight="600" fill="#1e293b">已展示歌曲去重池 + 待回答澄清槽位</text>

    <!-- Arrows between RunContext and Prepare / Finalize -->
    <path d="M 285 555 V 344" fill="none" stroke="#0284c7" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#arr-blue)"/>
    <text x="275" y="455" text-anchor="end" font-size="12.5" font-weight="700" fill="#0369a1">Load Session</text>

    <path d="M 670 484 V 652 H 558" fill="none" stroke="#0284c7" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#arr-blue)"/>
    <text x="660" y="536" text-anchor="end" font-size="12.5" font-weight="700" fill="#0369a1">Save State</text>

    <!-- ======================================================================= -->
    <!-- 6. BOTTOM-RIGHT: 7 AGENT TOOLS SUITE (Routed via clean bridge)          -->
    <!-- ======================================================================= -->
    <rect x="695" y="555" width="719" height="195" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="720" y="586" font-size="16" font-weight="800" fill="#065f46">7 Agent Tools (由 Tools Node 统一调度并回写 RunContext)</text>

    <!-- Bidirectional Tool Invocation Arrows with clean arc bridge over Finalize->Response line (y=458) -->
    <path d="M 1015 327 V 448 A 10 10 0 0 1 1015 468 V 551" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#arr-green)"/>
    <path d="M 1035 555 V 468 A 10 10 0 0 0 1035 448 V 331" fill="none" stroke="#059669" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#arr-green)"/>

    <g filter="url(#card-shadow)">
      <!-- Row 1: 4 Data & Profile Tools -->
      <rect x="718" y="602" width="160" height="60" rx="9" fill="#ffffff" stroke="#10b981" stroke-width="1.8"/>
      <text x="798" y="628" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="800" fill="#065f46">search_songs</text>
      <text x="798" y="649" text-anchor="middle" font-size="12" fill="#475569">混合检索内核 (≤2次/轮)</text>

      <rect x="890" y="602" width="170" height="60" rx="9" fill="#ffffff" stroke="#10b981" stroke-width="1.8"/>
      <text x="975" y="628" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="800" fill="#065f46">refine_candidates</text>
      <text x="975" y="649" text-anchor="middle" font-size="12" fill="#475569">本轮候选集合减法</text>

      <rect x="1072" y="602" width="152" height="60" rx="9" fill="#ffffff" stroke="#10b981" stroke-width="1.8"/>
      <text x="1148" y="628" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="800" fill="#065f46">song_detail</text>
      <text x="1148" y="649" text-anchor="middle" font-size="12" fill="#475569">按需读取单曲详情</text>

      <rect x="1236" y="602" width="154" height="60" rx="9" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
      <text x="1313" y="628" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="800" fill="#0369a1">user_profile</text>
      <text x="1313" y="649" text-anchor="middle" font-size="12" fill="#475569">读取听歌画像标签</text>

      <!-- Row 2: 1 Memory Action + 2 Terminal Exit Tools -->
      <rect x="718" y="676" width="215" height="56" rx="9" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
      <text x="825" y="700" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="800" fill="#0369a1">remember_preference</text>
      <text x="825" y="720" text-anchor="middle" font-size="12" fill="#475569">落库长期喜好 / 排斥标签</text>

      <rect x="947" y="676" width="212" height="56" rx="9" fill="#fff1f2" stroke="#e11d48" stroke-width="1.8"/>
      <text x="1053" y="700" text-anchor="middle" font-size="14" font-weight="800" fill="#9f1239"><tspan font-family="Consolas, monospace">ask_user</tspan> (终态出口)</text>
      <text x="1053" y="720" text-anchor="middle" font-size="12" fill="#be123c">写入待澄清槽位 + 候选选项</text>

      <rect x="1173" y="676" width="217" height="56" rx="9" fill="#fff1f2" stroke="#e11d48" stroke-width="1.8"/>
      <text x="1281" y="700" text-anchor="middle" font-size="14" font-weight="800" fill="#9f1239"><tspan font-family="Consolas, monospace">finish</tspan> (终态出口)</text>
      <text x="1281" y="720" text-anchor="middle" font-size="12" fill="#be123c">白名单 + 约束复核通过后输出</text>
    </g>

  </svg>
</div>
</body>
</html>
