# 中文受控标签词表 v3 (contract C3)
#
# 06_llm_tagging.py lets DeepSeek pick tags ONLY from genre/mood/scene below;
# anything outside is discarded in code.
#
# v3 (per contracts_v1.md C3):
#   * removed the `voice` class — "有人声/纯音乐" lives in song_meta.vocal and the
#     language in song_meta.language (single-valued facts, not tags);
#   * kept only genre / mood / scene, values are the Chinese literal used in the
#     DB, tool enums and prompts alike (no English keys);
#   * added `aliases` (colloquial -> canonical) for阶段3 intent parsing;
#   * added `language_display` for展示 and intent parsing.
# After 06, tags with <5 songs get pruned or downgraded to an alias (C3.3).

version: 3

tag_types: [genre, mood, scene]

